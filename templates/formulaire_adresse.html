<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nouvelle Livraison</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            position: relative; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Arrière-plan avec emojis répétés (opacité à 0.12) */
        body::before {
            content: "😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦 😊 🍕 📦";
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            font-size: 4rem; 
            opacity: 0.12; 
            z-index: -1; 
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-around; 
            pointer-events: none; 
            overflow: hidden;
        }

        .touch-input { 
            font-size: 1.4rem; 
            border: 3px solid #555; 
            background: rgba(26, 26, 26, 0.9); 
            color: #fff; 
            border-radius: 12px; 
            padding: 15px; 
            width: 100%; 
            resize: none; 
        }
        .touch-label { font-size: 1.3rem; color: #f39c12; font-weight: bold; margin-bottom: 8px; display: block; }
        .touch-btn { height: 90px; font-size: 1.8rem; font-weight: bold; border-radius: 12px; }
        
        /* Overlays custom avec z-index élevé et design léché */
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(5px);
            z-index: 10000; 
            justify-content: center; 
            align-items: center; 
            animation: fadeIn 0.2s ease-in-out;
        }
        
        .modal-box { 
            background: #1a1a1a; 
            border: 3px solid #f39c12; 
            padding: 30px; 
            border-radius: 20px; 
            width: 95%; 
            max-width: 600px; 
            box-shadow: 0 0 40px rgba(243, 156, 18, 0.3);
            animation: scaleIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .main-container { max-width: 650px; margin: 50px auto; position: relative; z-index: 1; }
    </style>
</head>
<body class="p-3">

<div class="container-fluid main-container">
    <div class="mt-3">
        <label class="touch-label">NOTE (Max 200 car.) :</label>
        <textarea id="note" maxlength="200" rows="6" class="form-control touch-input" placeholder="Instructions spéciales / Note..."></textarea>
    </div>

    <button onclick="showConfirmation()" class="btn btn-primary w-100 touch-btn mt-4 shadow-lg" style="background-color: #f39c12; border-color: #e67e22; color: #000;">
        VALIDER LA COMMANDE
    </button>
</div>

<!-- Modal de Confirmation -->
<div id="confirmOverlay" class="overlay">
    <div class="modal-box text-center">
        <h3 class="text-warning mb-4" style="font-weight: bold; text-transform: uppercase;">✨ VÉRIFIER LA NOTE</h3>
        <div class="bg-dark p-3 rounded text-start border border-secondary mb-4" style="background: rgba(0,0,0,0.4) !important;">
            <p class="text-muted mb-1" style="font-size: 0.9rem;">NOTE :</p>
            <p id="c-note" style="font-size: 1.3rem; color: #fff; word-break: break-word;"></p>
        </div>
        <div class="d-flex gap-3">
            <button onclick="hideConfirmation()" class="btn btn-secondary w-50" style="height: 70px; font-size: 1.2rem; font-weight: bold;">MODIFIER</button>
            <button id="btnConfirmer" onclick="creerLivraison()" class="btn btn-success w-50" style="height: 70px; font-size: 1.2rem; font-weight: bold;">CONFIRMER</button>
        </div>
    </div>
</div>

<!-- Custom Message Overlay (Remplace les alert box de type browser) -->
<div id="customAlertOverlay" class="overlay">
    <div class="modal-box text-center" style="max-width: 450px; border-color: #3498db;" id="alertBoxBorder">
        <div id="alertIcon" style="font-size: 3rem; margin-bottom: 15px;">✅</div>
        <h3 id="alertTitle" class="text-info mb-3" style="font-weight: bold;">SUCCÈS</h3>
        <p id="alertMessage" class="mb-4" style="font-size: 1.2rem; color: #d2d2d2;"></p>
        <button id="alertBtn" onclick="closeCustomAlert()" class="btn btn-primary w-100" style="height: 60px; font-size: 1.2rem; font-weight: bold; background-color: #3498db; border: none;">OK</button>
    </div>
</div>

<script>
    // Fonction de Notification Customisée (Remplace alert())
    let alertCallback = null;
    function showCustomAlert(title, message, type = 'success', callback = null) {
        const overlay = document.getElementById('customAlertOverlay');
        const titleEl = document.getElementById('alertTitle');
        const msgEl = document.getElementById('alertMessage');
        const iconEl = document.getElementById('alertIcon');
        const boxEl = document.getElementById('alertBoxBorder');
        const btnEl = document.getElementById('alertBtn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        alertCallback = callback;

        if (type === 'success') {
            iconEl.innerText = "✅";
            titleEl.className = "text-success mb-3";
            boxEl.style.borderColor = "#2ecc71";
            btnEl.className = "btn btn-success w-100";
            btnEl.style.backgroundColor = "#2ecc71";
        } else {
            iconEl.innerText = "❌";
            titleEl.className = "text-danger mb-3";
            boxEl.style.borderColor = "#e74c3c";
            btnEl.className = "btn btn-danger w-100";
            btnEl.style.backgroundColor = "#e74c3c";
        }

        overlay.style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('customAlertOverlay').style.display = 'none';
        if (typeof alertCallback === 'function') {
            alertCallback();
            alertCallback = null;
        }
    }

    function showConfirmation() {
        const noteValue = document.getElementById('note').value.trim();
        if (!noteValue) { 
            showCustomAlert("Attention", "Veuillez entrer une note avant de valider !", "error");
            return; 
        }
        document.getElementById('c-note').innerText = noteValue;
        document.getElementById('confirmOverlay').style.display = 'flex';
    }

    function hideConfirmation() { 
        document.getElementById('confirmOverlay').style.display = 'none'; 
    }

    async function creerLivraison() {
        hideConfirmation();
        const btn = document.getElementById('btnConfirmer');
        btn.disabled = true; 
        btn.innerText = "ENVOI...";

        const payload = {
            adresse: document.getElementById('note').value.substring(0, 200),
            telephone: "test",
            heure: "test",
            note: "test"
        };

        try {
            const res = await fetch('/nouvelle_livraison', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                showCustomAlert("Succès", "✅ COMMANDE ENREGISTRÉE AVEC SUCCÈS !", "success", () => {
                    location.reload();
                });
            } else { 
                throw new Error(data.error || "Erreur serveur"); 
            }
        } catch(e) {
            showCustomAlert("Erreur", "❌ ERREUR : " + e.message, "error");
            btn.disabled = false; 
            btn.innerText = "CONFIRMER";
        }
    }
</script>
</body>
</html>
