<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nouvelle Livraison</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .touch-input { 
            font-size: 1.4rem; border: 3px solid #555; background: #1a1a1a; 
            color: #fff; border-radius: 12px; padding: 15px; width: 100%; resize: none; 
        }
        .touch-label { font-size: 1.3rem; color: #f39c12; font-weight: bold; margin-bottom: 8px; display: block; }
        .touch-btn { height: 90px; font-size: 1.8rem; font-weight: bold; border-radius: 12px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #222; border: 4px solid #f39c12; padding: 30px; border-radius: 20px; width: 95%; max-width: 600px; }
        /* Style pour centrer le tout */
        .main-container { max-width: 650px; margin: 0 auto; }
    </style>
</head>
<body class="p-3">

<div class="container-fluid main-container">
    <h2 class="text-center mb-4 text-warning" style="font-size: 2.2rem;">📦 NOUVELLE LIVRAISON</h2>
    
    <div class="mb-3">
        <label class="touch-label">ADRESSE :</label>
        <textarea id="adresse" maxlength="200" rows="4" class="form-control touch-input" placeholder="Adresse complète (max 200 car.)..."></textarea>
    </div>

    <div class="row">
        <div class="col-6">
            <label class="touch-label">TÉL (15 car.) :</label>
            <input type="tel" id="telephone" maxlength="15" class="form-control touch-input" style="height: 60px;" placeholder="000-000-0000">
        </div>
        <div class="col-6">
            <label class="touch-label">HEURE :</label>
            <input type="text" id="heure" maxlength="20" class="form-control touch-input" style="height: 60px;" placeholder="ASAP / 18:30">
        </div>
    </div>

    <div class="mt-3">
        <label class="touch-label">NOTE (Max 200) :</label>
        <textarea id="note" maxlength="200" rows="4" class="form-control touch-input" placeholder="Instructions spéciales..."></textarea>
    </div>

    <button onclick="showConfirmation()" class="btn btn-primary w-100 touch-btn mt-4 shadow-lg">
        VALIDER LA COMMANDE
    </button>
</div>

<div id="confirmOverlay" class="overlay">
    <div class="modal-box text-center">
        <h3 class="text-warning mb-4">VÉRIFIER LES DÉTAILS</h3>
        <div class="bg-dark p-3 rounded text-start border border-secondary mb-4">
            <p><strong>Adr:</strong> <span id="c-addr"></span></p>
            <p><strong>Tel:</strong> <span id="c-tel"></span></p>
            <p><strong>Heure:</strong> <span id="c-heure"></span></p>
            <p><strong>Note:</strong> <span id="c-note"></span></p>
        </div>
        <div class="d-flex gap-3">
            <button onclick="hideConfirmation()" class="btn btn-secondary w-50" style="height: 70px;">MODIFIER</button>
            <button id="btnConfirmer" onclick="creerLivraison()" class="btn btn-success w-50" style="height: 70px;">CONFIRMER</button>
        </div>
    </div>
</div>

<script>
    function showConfirmation() {
        if (!document.getElementById('adresse').value.trim()) { alert("L'adresse est requise !"); return; }
        document.getElementById('c-addr').innerText = document.getElementById('adresse').value;
        document.getElementById('c-tel').innerText = document.getElementById('telephone').value || "N/A";
        document.getElementById('c-heure').innerText = document.getElementById('heure').value || "ASAP";
        document.getElementById('c-note').innerText = document.getElementById('note').value || "-";
        document.getElementById('confirmOverlay').style.display = 'flex';
    }
    function hideConfirmation() { document.getElementById('confirmOverlay').style.display = 'none'; }

    async function creerLivraison() {
        const btn = document.getElementById('btnConfirmer');
        btn.disabled = true; btn.innerText = "ENVOI...";
        const payload = {
            adresse: document.getElementById('adresse').value,
            telephone: document.getElementById('telephone').value,
            heure: document.getElementById('heure').value,
            note: document.getElementById('note').value
        };
        try {
            const res = await fetch('/nouvelle_livraison', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                alert("✅ COMMANDE ENREGISTRÉE !");
                location.reload();
            } else { throw new Error(data.error); }
        } catch(e) {
            alert("❌ ERREUR : " + e.message);
            btn.disabled = false; btn.innerText = "CONFIRMER";
        }
    }
</script>
</body>
</html>
