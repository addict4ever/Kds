<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KDS - Friteuse & Accompagnements</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 10px;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-indicator {
            font-size: 0.85rem;
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(auto-fit, minmax(0, 1fr));
            gap: 8px;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 6px 8px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-top: 4px solid #3b82f6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .card:nth-child(2n) { border-top-color: #8b5cf6; }
        .card:nth-child(3n) { border-top-color: #ec4899; }
        .card:nth-child(4n) { border-top-color: #10b981; }
        .card:nth-child(5n) { border-top-color: #f59e0b; }
        .card:nth-child(6n) { border-top-color: #38bdf8; }
        
        .item-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1.1;
            max-height: 2.2em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .item-count {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1;
        }

        .has-stock {
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .no-stock {
            color: #475569;
        }
    </style>
</head>
<body>

    

    <div class="grid-container">
        {% for item, qty in counts.items() %}
        <div class="card">
            <div class="item-name">
                {{ item }}
            </div>
            
            <div data-item-count="{{ item }}" class="item-count {% if qty > 0 %}has-stock{% else %}no-stock{% endif %}">
                {{ qty }}
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        function updateCounts() {
            fetch('/kds_friteuse?json=1', {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                for (const [item, qty] of Object.entries(data)) {
                    const countElement = document.querySelector(`[data-item-count="${CSS.escape(item)}"]`);
                    if (countElement) {
                        countElement.textContent = qty;
                        if (qty > 0) {
                            countElement.className = "item-count has-stock";
                        } else {
                            countElement.className = "item-count no-stock";
                        }
                    }
                }
            })
            .catch(error => console.error('Erreur lors de la mise à jour des données KDS Friteuse :', error));
        }

        setInterval(updateCounts, 5000);
    </script>

</body>
</html>
